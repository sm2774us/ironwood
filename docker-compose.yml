services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      AUTHOR_TOKEN: ${AUTHOR_TOKEN:-compose-local-token}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AUTHOR_TOKEN: ${AUTHOR_TOKEN:-compose-local-token}
    environment:
      API_UPSTREAM: http://api:3001
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_healthy }
